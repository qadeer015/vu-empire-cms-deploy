<!doctype html>
<html>

<body style="margin:0;padding:0;background:#f4f6f8;font-family:Arial,Helvetica,sans-serif;">
    <table width="100%" cellspacing="0" cellpadding="0" style="padding:20px 0;background:#f4f6f8;">
        <tr>
            <td align="center">
                <table width="600" cellpadding="0" cellspacing="0"
                    style="background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 4px 15px rgba(0,0,0,0.08);">
                    <tr>
                        <td style="padding:30px;text-align:center;">
                            <img src="https://www.vuempire.online/assets/brand/logo.png" width="150"
                                style="margin-bottom:10px;">
                            <h2 style="color:#0f172a;margin-bottom:10px;">New Post Awaiting Review</h2>
                            <p style="color:#64748b;font-size:14px;">A new post has been submitted by
                                <strong>{{author_name}}</strong> and is awaiting your review.
                            </p>
                        </td>
                    </tr>

                    <tr>
                        <td style="padding:0 30px 20px 30px;">
                            <div style="background:#f8fafc;padding:20px;border-radius:8px;border:1px solid #e2e8f0;">
                                <h3 style="margin:0 0 10px 0;color:#0f172a;font-size:18px;">{{post_title}}</h3>
                                <p style="color:#64748b;font-size:13px;margin:5px 0;"><strong>Author:</strong>
                                    {{author_name}} ({{author_email}})</p>
                                <p style="color:#64748b;font-size:13px;margin:5px 0;"><strong>Status:</strong> <span
                                        style="color:#f59e0b;font-weight:bold;">Pending Review</span></p>
                                <p style="color:#64748b;font-size:13px;margin:5px 0;"><strong>Submitted:</strong>
                                    {{submitted_at}}</p>
                            </div>
                        </td>
                    </tr>

                    <tr>
                        <td style="padding:0 30px 30px 30px;text-align:center;">
                            <a href="{{review_link}}"
                                style="display:inline-block;padding:12px 22px;background:#06b6d4;border-radius:8px;color:#fff;text-decoration:none;font-weight:bold;">Review
                                Post</a>
                        </td>
                    </tr>

                    <tr>
                        <td style="background:#f8fafc;padding:15px;text-align:center;font-size:12px;color:#94a3b8;">
                            © {{year}} {{app_name}}
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>

</html>
