name: Mirror to Deployment Repository

on:
  push:
    branches:
      - main

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Test destination repository
        env:
          DEPLOY_REPO_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
        run: |
          AUTH=$(printf 'qadeer015:%s' "$DEPLOY_REPO_TOKEN" | base64 -w 0)

          git \
            -c "http.extraHeader=Authorization: Basic $AUTH" \
            ls-remote \
            https://github.com/qadeer015/vu-empire-cms-deploy.git

      - name: Push mirror
        env:
          DEPLOY_REPO_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
        run: |
          AUTH=$(printf 'qadeer015:%s' "$DEPLOY_REPO_TOKEN" | base64 -w 0)

          git remote add deployment \
            https://github.com/qadeer015/vu-empire-cms-deploy.git

          git \
            -c "http.extraHeader=Authorization: Basic $AUTH" \
            push deployment main