name: Mirror to Deployment Repository

on:
  push:
    branches:
      - main

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git credentials
        env:
          DEPLOY_REPO_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git config --global credential.helper store

          printf "https://qadeer015:%s@github.com\n" "$DEPLOY_REPO_TOKEN" \
            > ~/.git-credentials

      - name: Test destination repository
        run: |
          git ls-remote https://github.com/qadeer015/vu-empire-cms-deploy.git

      - name: Push mirror
        run: |
          git remote add deployment \
            https://github.com/qadeer015/vu-empire-cms-deploy.git

          git push deployment main --force

      - name: Cleanup credentials
        if: always()
        run: |
          rm -f ~/.git-credentials